services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dentflow
      POSTGRES_USER: dentflow
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dentflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentflow -d dentflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm dev:api"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://dentflow:local-development-only@postgres:5432/dentflow
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - .:/workspace
      - dentflow-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dentflow-postgres:
  dentflow-node-modules:
